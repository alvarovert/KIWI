<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>KIWI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        
        <!-- VISTA 1: INICIO -->
        <section id="view-inicio" class="view active">
            <div id="banner-kiwi" class="top-banner banner-large banner-glued interactive">KIWI</div>
            <div id="dropzone" class="btn-middle btn-light interactive">Selecciona tus archivos</div>
            <button id="btn-procesar-inicio" class="btn-bottom" disabled>Procesar</button>
        </section>

        <!-- VISTA 2: SELECCIONADOS -->
        <section id="view-seleccionados" class="view">
            <div id="txt-cantidad-archivos" class="top-banner banner-glued interactive tooltip">0 Archivos</div>
            <button id="btn-aplicar-filtros" class="btn-middle btn-light interactive">Aplicar filtros</button>
            <button id="btn-consolidar-directo" class="btn-bottom">Consolidar</button>
        </section>

        <!-- VISTA 3: FILTROS -->
        <section id="view-aplicar-filtros" class="view">
            <div class="filtros-box">
                <div class="filtros-header">
                    <span class="col-title">Columnas</span>
                    <span class="col-title">Registros</span>
                </div>
                <div class="filtros-body">
                    <div class="list-container"><ul id="lista-columnas"></ul></div>
                    <div class="list-container"><ul id="lista-registros"></ul></div>
                </div>
                <button id="btn-aceptar-filtros" class="btn-aceptar">ACEPTAR</button>
            </div>
        </section>

        <!-- VISTA 4: FILTROS APLICADOS -->
        <section id="view-filtros-aplicados" class="view">
            <div id="txt-cantidad-filtros" class="top-banner banner-glued interactive tooltip">0 Archivos</div>
            <div id="txt-filtro-resumen" class="btn-middle btn-light interactive tooltip-filtro">Ningún filtro</div>
            <button id="btn-consolidar-filtrado" class="btn-bottom">Consolidar</button>
        </section>

        <!-- VISTA 5: EXITO -->
        <section id="view-exito" class="view">
            <div id="stats-exito" class="top-banner banner-glued">Peso del archivo: 0gb<br>Cantidad de filas: 0</div>
            <div id="nombre-archivo-exito" class="btn-middle btn-light">Consolidado.csv</div>
            <button id="btn-descargar" class="btn-bottom">Descargar</button>
        </section>

        <!-- FOOTER UNIVERSAL -->
        <footer class="app-footer">Hecho por Alvaro Menacho</footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
